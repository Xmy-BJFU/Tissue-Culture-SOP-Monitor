# Tissue-Culture SOP Monitor CI
# This repo is a custom detection/OCR project, not the official Ultralytics YOLO tree.
# The inherited full Ultralytics matrix (benchmarks, export tests, GPU/Jetson) always
# failed here and emailed on every push and daily schedule.

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check project scripts
        run: |
          python -m py_compile \
            detect.py \
            train.py \
            train1.py \
            val.py \
            video.py \
            video_ocr.py \
            video_track_ocr.py \
            ocr_track_bind.py \
            extract_frames.py \
            json_to_yolo_obb.py \
            split_yolo_obb.py
      - name: Install numpy
        run: pip install numpy
      - name: Check reagent label matching
        run: |
          python - <<'PY'
          from ocr_track_bind import match_reagent_label

          cases = {
              "75%酒精": "酒精",
              "无菌水": "无菌水",
              "灭菌水": "无菌水",
              "灭菌瓶": "灭菌瓶",
              "次氯酸钠": "次氯酸钠",
              "MS培养基": "培养基",
          }
          for text, expected in cases.items():
              got = match_reagent_label(text)
              assert got == expected, f"{text!r} -> {got!r}, expected {expected!r}"
          print("ocr_track_bind match_reagent_label ok")
          PY
